# Non-sensitive configuration, separated from the application code
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: devops-task
data:
  APP_ENV: "development"
  APP_MESSAGE: "Hello from Kubernetes ConfigMap"
  index.html: |
    <!DOCTYPE html>
    <html>
      <head><title>Kubernetes Week 7</title></head>
      <body style="font-family:Arial;margin:40px">
        <h1>Hello from Kubernetes!</h1>
        <p>This page is served from a ConfigMap mounted into the pod.</p>
      </body>
    </html>
