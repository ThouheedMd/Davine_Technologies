# Sensitive values. stringData lets you write plain text; Kubernetes stores it base64-encoded.
# These are DEMO values - never commit real passwords to Git.
apiVersion: v1
kind: Secret
metadata:
  name: web-secret
  namespace: devops-task
type: Opaque
stringData:
  DB_USER: "appuser"
  DB_PASSWORD: "change-me-demo-only"
