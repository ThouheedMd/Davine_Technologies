apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: devops-app
  labels:
    app: web-app
  annotations:
    kubernetes.io/change-cause: "Initial deployment: nginx 1.25-alpine"
spec:
  replicas: 3                      # at least 3 replicas
  revisionHistoryLimit: 5          # keep history so rollback is possible
  selector:
    matchLabels:
      app: web-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                  # at most 1 extra pod during an update
      maxUnavailable: 0            # never drop below 3 ready pods
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
