# Weekly task: multi-container application (Nginx + Node.js)
services:
  app:
    build: ./node-app
    image: ${DOCKERHUB_USER:-yourname}/docker-week4-app:1.0
    container_name: week4-app
    environment:
      APP_ENV: development
      DATA_DIR: /data
    volumes:
      - app-data:/data
    networks:
      - week4-net
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: week4-web
    ports:
      - "8080:80"
    volumes:
      - ./nginx/index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - week4-net
    restart: unless-stopped

volumes:
  app-data:

networks:
  week4-net:
    driver: bridge