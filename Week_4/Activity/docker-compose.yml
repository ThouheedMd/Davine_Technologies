# Activity: 3-tier application (Frontend + Backend + Database)
services:
  frontend:
    build: ./frontend
    image: ${DOCKERHUB_USER:-yourname}/week4-frontend:1.0
    container_name: week4-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-net
    restart: unless-stopped

  backend:
    build: ./backend
    image: ${DOCKERHUB_USER:-yourname}/week4-backend:1.0
    container_name: week4-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-appuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
      DB_NAME: ${POSTGRES_DB:-appdb}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: week4-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-net
    restart: unless-stopped

volumes:
  db-data:

networks:
  app-net:
    driver: bridge